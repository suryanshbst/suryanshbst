<svg fill="none" viewBox="0 0 800 160" width="800" height="160" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes card-glow {
      0%, 100% { opacity: 0.05; }
      50% { opacity: 0.12; }
    }
  </style>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="160" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="3" height="160" rx="1.5" fill="#f0883e"/>
  <!-- Title -->
  <text x="24" y="32" font-size="18" font-weight="bold" font-family="'Courier New', monospace">
    <tspan fill="#58a6ff">Type-Arena </tspan><tspan fill="#ec4899">::</tspan><tspan fill="#58a6ff"> Real-Time Typing Competition</tspan>
  </text>
  <!-- Badge -->
  <rect x="24" y="42" width="110" height="22" rx="4" fill="#241307" stroke="#f0883e" stroke-width="1"/>
  <text x="79" y="57" text-anchor="middle" font-size="11" fill="#f0883e" font-family="'Courier New', monospace">MULTIPLAYER</text>
  <!-- Description -->
  <text x="24" y="82" font-size="11" fill="#8b949e" font-family="'Courier New', monospace">Real-time multiplayer typing competition with live</text>
  <text x="24" y="98" font-size="11" fill="#8b949e" font-family="'Courier New', monospace">leaderboards, WPM tracking, and global rankings.</text>
  <!-- Tags -->
  <rect x="24" y="112" width="70" height="22" rx="11" fill="none" stroke="#ec4899" stroke-opacity="0.4"/>
  <text x="59" y="127" text-anchor="middle" font-size="10" fill="#ec4899" font-family="'Courier New', monospace">Real-Time</text>
  <rect x="102" y="112" width="90" height="22" rx="11" fill="none" stroke="#ec4899" stroke-opacity="0.4"/>
  <text x="147" y="127" text-anchor="middle" font-size="10" fill="#ec4899" font-family="'Courier New', monospace">Leaderboard</text>
  <rect x="200" y="112" width="85" height="22" rx="11" fill="none" stroke="#ec4899" stroke-opacity="0.4"/>
  <text x="242" y="127" text-anchor="middle" font-size="10" fill="#ec4899" font-family="'Courier New', monospace">Multiplayer</text>
  <!-- Ambient glow -->
  <circle cx="750" cy="130" r="80" fill="url(#glow)" style="animation: card-glow 4s ease-in-out infinite"/>
</svg>